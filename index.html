<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>REST locate</title>
</head>
<body>
<h2>REST locate</h2>
<form id="rest-locate" action="locate" method="GET">
    <label for="search">search:</label><input id="search" name="search" type="text"/><br/>
    <label for="regex">regex:</label><input id="regex" name="regex" type="text"/><br/>
    <label for="ci">case-insensitive?</label><input id="ci" name="ci" type="checkbox" checked/><br/>
    <input type="submit" value="search"/>
</form>
</body>
</html>
